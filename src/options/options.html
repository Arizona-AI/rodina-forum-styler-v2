<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rodina Forum Styler — панель управления</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 4v10l-7 4-7-4V7z"></path>
            <path d="M12 3v18M5 7l7 4 7-4"></path>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Rodina Forum Styler</strong>
          <small>Форум по-своему</small>
        </span>
      </div>
      <nav class="nav" id="nav" aria-label="Разделы настроек"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="btn btn-ghost nav-toggle" id="navToggle" type="button"
                aria-label="Меню разделов" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>

        <div class="search" role="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4.2-4.2"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="Поиск по настройкам…"
                 aria-label="Поиск по настройкам" autocomplete="off" spellcheck="false">
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost icon-btn" id="shellThemeBtn" type="button"
                  aria-label="Тема интерфейса" title="Тема интерфейса"></button>
          <a class="btn btn-secondary" id="openForumBtn" href="https://forum.rodina-rp.com/"
             target="_blank" rel="noopener noreferrer">Открыть форум</a>
        </div>
      </header>

      <div class="content" id="content" tabindex="-1"></div>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
